<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Akylla Gestão</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f8fafc; color: #0f172a; font-family: "Segoe UI", system-ui, sans-serif; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: #334155; line-height: 1.5; }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; border: 0; border-radius: 0.5rem;
        background: #b45309; color: #fff; font-size: 0.95rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>O Akylla Gestão precisa de internet para registrar vendas e consultar dados. Assim que a conexão voltar, tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
