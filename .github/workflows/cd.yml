# Deploy contínuo — Akylla Gestão (Fase 1 · 1G)
#
# Roda DEPOIS de o CI passar na `main` (ou manualmente). Não faz nada até o
# proprietário ligar o deploy:
#   1. GitHub › Settings › Environments › `production` (com "Required
#      reviewers" para aprovar cada deploy).
#   2. Settings › Secrets and variables › Actions:
#      - variável  DEPLOY_ENABLED = true
#      - secret    PRODUCTION_DATABASE_URL (role SEM superusuário/BYPASSRLS)
#      - secrets   DEPLOY_HOOK_API, DEPLOY_HOOK_WEB, DEPLOY_HOOK_WORKER
#                  (URLs de deploy hook do provedor: Render "Deploy Hook",
#                  Railway/Koyeb/Fly equivalentes)
#      - variável  PRODUCTION_API_URL (ex.: https://api.akyllagestao.com.br)
#      - variável  PRODUCTION_WEB_URL (ex.: https://app.akyllagestao.com.br)
# Guia completo: docs/operations/DEPLOY.md · rollback: docs/operations/RUNBOOK.md §5

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy produção
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      NODE_VERSION: "22"
    steps:
      - name: Checkout (commit aprovado pelo CI)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Migrations ANTES do código novo: o padrão do projeto é migration
      # aditiva, compatível com a versão anterior (rollback só da aplicação).
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run db:deploy

      - name: Trigger deploy (API, worker, web)
        env:
          HOOK_API: ${{ secrets.DEPLOY_HOOK_API }}
          HOOK_WORKER: ${{ secrets.DEPLOY_HOOK_WORKER }}
          HOOK_WEB: ${{ secrets.DEPLOY_HOOK_WEB }}
        run: |
          for name in API WORKER WEB; do
            var="HOOK_$name"; url="${!var}"
            if [ -z "$url" ]; then echo "::error::secret DEPLOY_HOOK_$name ausente"; exit 1; fi
            echo "Disparando deploy: $name"
            curl -fsS -X POST "$url" > /dev/null
          done

      - name: Health check (até 10 min)
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: |
          deadline=$((SECONDS + 600))
          until curl -fsS "$API_URL/health/ready" | grep -q '"database":"ok"'; do
            if [ $SECONDS -ge $deadline ]; then echo "::error::API não ficou pronta em 10 min — ver RUNBOOK §5 (rollback)"; exit 1; fi
            sleep 15
          done
          curl -fsS -o /dev/null "$WEB_URL/login"
          echo "✅ API (/health/ready) e web (/login) respondendo"
