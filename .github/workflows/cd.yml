name: CD (Deploy to Staging)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/**"

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run DB migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Deploy to staging
        run: echo "Deploy to staging (configure your hosting provider)"
        # Example for common providers:
        # - Vercel: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        # - Railway: npx railway up --service=api --token=${{ secrets.RAILWAY_TOKEN }}
        # - Render: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
        # - Docker: docker build -t akylla-api . && docker push ...

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run DB migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy to production
        run: echo "Deploy to production (configure your hosting provider)"
        # Requires manual approval in GitHub Environments