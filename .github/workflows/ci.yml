name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  # Role da aplicação nos testes: SEM superusuário e SEM BYPASSRLS — senão a
  # RLS (Fase 1 · 1E) ficaria inerte e os testes de isolamento não provariam
  # nada. O superusuário `postgres` do serviço só cria esse role.
  DATABASE_URL: postgresql://akylla_app:akylla_app@localhost:5432/petflow_test?schema=public
  ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petflow_test

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # `postinstall` gera o Prisma Client (sem ele o typecheck falha)
      - name: Install dependencies
        run: npm ci

      - name: Scan for secrets
        run: npm run check:secrets

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Tests (PostgreSQL + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create application role (no SUPERUSER / no BYPASSRLS)
        run: |
          npx prisma db execute --url "$ADMIN_DATABASE_URL" --stdin <<'SQL'
          CREATE ROLE akylla_app LOGIN PASSWORD 'akylla_app' CREATEDB NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE petflow_test OWNER TO akylla_app;
          ALTER SCHEMA public OWNER TO akylla_app;
          SQL

      - name: Apply migrations
        run: npm run db:deploy

      - name: Check migration consistency
        run: npm run check:migrations

      - name: Run tests with coverage (mínimos em config/vitest.config.ts)
        run: npm run test:coverage

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

  validate-db:
    name: Validate DB Schema
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

  a11y:
    name: Navegador (acessibilidade + E2E)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Create application role (no SUPERUSER / no BYPASSRLS)
        run: |
          npx prisma db execute --url "$ADMIN_DATABASE_URL" --stdin <<'SQL'
          CREATE ROLE akylla_app LOGIN PASSWORD 'akylla_app' CREATEDB NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE petflow_test OWNER TO akylla_app;
          ALTER SCHEMA public OWNER TO akylla_app;
          SQL

      - name: Apply migrations
        run: npm run db:deploy

      - name: Build all workspaces
        run: npm run build

      - name: Start API and web
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          (cd apps/web && npx next start -p 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null && curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          cat api.log web.log
          exit 1

      - name: Run axe audit (WCAG 2.1 AA)
        run: npm run test:a11y

      - name: Run E2E flows (Playwright)
        run: npm run test:e2e

      - name: Publish Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
